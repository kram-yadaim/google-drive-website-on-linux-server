<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - {{ title }}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <form class="login-card" method="post" action="/login">
    <img class="login-logo" src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="56" height="56">
    <h1>Sign in</h1>
    <p class="muted">to continue to {{ title }}</p>
    {% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field">
      <span>Username</span>
      <input name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
    </label>
    <label class="field">
      <span>Password</span>
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</body>
</html>
